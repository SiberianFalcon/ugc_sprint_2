name: ugc-storage-research

services:
  mongo:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "1"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-research-data:/data/db
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-research-data:/var/lib/postgresql/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mongo-research-data:
  postgres-research-data:
